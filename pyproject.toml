[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessrl"
version = "0.1.0"
description = "A from-scratch chess engine and a reinforcement-learning agent that learns to play it by self-play."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Francisco Javier Gómez Pulido" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# python-chess is used ONLY as a test oracle, never by the engine itself.
dev = ["pytest>=8", "pytest-timeout>=2", "python-chess>=1.10", "ruff>=0.5"]
rl = ["torch>=2.2", "gymnasium>=0.29"]
vision = ["opencv-python-headless>=4.8", "pillow>=10"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
all = ["chessrl[rl,vision,export]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.setuptools.package-data]
chessrl = ["web/static/*", "levels/levels.json", "agents/baseline_elo.json"]

[tool.ruff.lint.per-file-ignores]
"src/chessrl/eval/plots.py" = ["E501"]
"src/chessrl/vision/*.py" = ["E501"]
"tests/vision/*.py" = ["E501"]
